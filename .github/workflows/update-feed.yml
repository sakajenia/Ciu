name: Update Instagram feed

on:
  schedule:
    # Daily at 06:00 UTC (~08:00 in Italy)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Instagram posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_feed.py

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain data/feed.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed.json
            git commit -m "chore(feed): daily Instagram refresh"
            git push
          else
            echo "No changes."
          fi
